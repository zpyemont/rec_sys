apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker-deployment
  labels:
    app: ranker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ranker
  template:
    metadata:
      labels:
        app: ranker
    spec:
      serviceAccountName: ranker-sa
      containers:
      - name: ranker
        image: europe-west1-docker.pkg.dev/looksyuk/containers/ranker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8500
        resources:
          requests:
            cpu: 400m
            memory: 2Gi
          limits:
            cpu: 500m
            memory: 2Gi
        env:
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: ranker-secrets
              key: postgres_dsn
        - name: BQ_PROJECT
          valueFrom:
            secretKeyRef:
              name: ranker-secrets
              key: bq_project
        - name: BQ_DATASET
          valueFrom:
            secretKeyRef:
              name: ranker-secrets
              key: bq_dataset
        - name: BQ_TABLE_PRODUCTS
          value: "products"
        - name: GCS_BUCKET_PRODUCTS
          value: "looksy_shopify_parsed"
        # Parser VM worker static internal IP (from Terraform: parser_internal_ip)
        # This IP persists across MIG VM replacements
        - name: EMBEDDING_SERVICE_URL
          value: "http://10.154.15.221:8080"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8500
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8500
          initialDelaySeconds: 10
          periodSeconds: 20
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.3
        args:
        - --structured-logs
        - --address=127.0.0.1
        - --port=5432
        - looksyuk:europe-west1:looksy-catalog-prod
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 200m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      # For Firestore/BigQuery auth, prefer Workload Identity; otherwise mount SA key
---
apiVersion: v1
kind: Service
metadata:
  name: ranker-svc
  labels:
    app: ranker
  annotations:
    cloud.google.com/backend-config: '{"default": "ranker-backend-config"}'
spec:
  type: ClusterIP
  selector:
    app: ranker
  ports:
  - name: http
    port: 8500
    targetPort: 8500
